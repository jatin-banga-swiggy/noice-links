<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Noice Labs products</title>
  <style>
    :root { color-scheme: light; --ink: #1b1b1b; --muted: #5f5f5f; --line: #e7e3d6; --accent: #f5c518; --card: #fff; --page: #faf8f1; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { padding: 28px 16px 8px; max-width: 1080px; margin: 0 auto; }
    header img { height: 28px; display: block; }
    header p { margin: 10px 0 0; color: var(--muted); }
    main { max-width: 1080px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
    .photo { position: relative; aspect-ratio: 4 / 3; background: #f3f0e6; display: grid; place-items: center; }
    .photo img { max-width: 70%; max-height: 88%; object-fit: contain; }
    .photo .none { color: var(--muted); font-size: 13px; }
    .badge { position: absolute; top: 10px; left: 10px; padding: 2px 10px; border-radius: 999px; background: var(--accent); font-size: 12px; font-weight: 600; }
    .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
    h2 { margin: 0; font-size: 16px; line-height: 1.3; }
    .qr { width: 168px; align-self: center; padding: 8px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
    .qr svg { display: block; width: 100%; height: auto; }
    .links { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
    .links a { color: var(--ink); text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; overflow-wrap: anywhere; }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <img src="images/noice-labs-logo.webp" alt="Noice Labs">
    <p>Scan a product's code to ask about it.</p>
  </header>
  <main id="grid"><p class="empty">Loading…</p></main>
  <script src="vendor/qrcode.js"></script>
  <script>
    const grid = document.getElementById('grid');
    const el = (tag, props = {}, ...children) => {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    };

    const NUMBERS = ['One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'];

    async function card(code, item, index) {
      // The QR holds the short link on whatever host serves this page, so it is right once published.
      const short = new URL(code, location.origin + location.pathname).href;
      const qr = el('div', { className: 'qr', title: short });
      qr.innerHTML = await QRCode.toString(short, { type: 'svg', margin: 1, errorCorrectionLevel: 'M' });
      const links = el('div', { className: 'links' }, el('a', { href: code, textContent: short.replace(/^https?:\/\//, '') }));
      if (item.page) links.append(el('a', { href: item.page, textContent: 'Guide' }));
      return el('article', { className: 'card' },
        el('div', { className: 'photo' },
          el('span', { className: 'badge', textContent: NUMBERS[index] ?? String(index + 1) }),
          item.image ? el('img', { src: item.image, alt: item.name ?? code, loading: 'lazy' }) : el('span', { className: 'none', textContent: 'No photo yet' })),
        el('div', { className: 'body' }, el('h2', { textContent: item.name ?? code }), qr, links),
      );
    }

    fetch('links.json', { cache: 'no-store' })
      .then(response => response.json())
      .then(links => Promise.all(Object.entries(links).map(([code, item], index) => card(code, item, index))))
      .then(cards => grid.replaceChildren(...cards))
      .catch(() => grid.replaceChildren(el('p', { className: 'empty', textContent: 'Products could not be loaded.' })));
  </script>
</body>
</html>
